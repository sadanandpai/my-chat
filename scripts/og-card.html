<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>og</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f4f2f7;
      }
      body {
        font-family:
          "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        color: #0c0a12;
        background:
          radial-gradient(900px 420px at 88% -10%, rgba(109, 40, 217, 0.16), transparent 58%),
          #f4f2f7;
        display: flex;
        align-items: center;
        padding: 0 88px;
      }
      .copy {
        flex: 1;
        min-width: 0;
      }
      .brand {
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #0c0a12;
      }
      h1 {
        margin: 22px 0 0;
        font-size: 64px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.08;
        max-width: 12ch;
      }
      p {
        margin: 22px 0 0;
        max-width: 34ch;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        font-size: 22px;
        line-height: 1.45;
        color: #5c5666;
      }
      .orbit {
        position: relative;
        flex: none;
        width: 380px;
        height: 380px;
      }
      .ring {
        position: absolute;
        inset: 36px;
        border-radius: 50%;
        border: 2px dotted rgba(109, 40, 217, 0.45);
      }
      img {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 92px;
        height: 92px;
        margin: -46px 0 0 -46px;
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 18%;
        border: 4px solid #fff;
        box-shadow: 0 1px 2px rgba(12, 10, 18, 0.04),
          0 12px 28px -12px rgba(12, 10, 18, 0.18);
      }
      img:nth-of-type(1) {
        transform: rotate(-20deg) translateY(-148px) rotate(20deg);
      }
      img:nth-of-type(2) {
        transform: rotate(40deg) translateY(-148px) rotate(-40deg);
      }
      img:nth-of-type(3) {
        transform: rotate(100deg) translateY(-148px) rotate(-100deg);
      }
      img:nth-of-type(4) {
        transform: rotate(160deg) translateY(-148px) rotate(-160deg);
      }
      img:nth-of-type(5) {
        transform: rotate(220deg) translateY(-148px) rotate(-220deg);
      }
      img:nth-of-type(6) {
        transform: rotate(280deg) translateY(-148px) rotate(-280deg);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">Character Chat</div>
      <h1>Talk like you sat down with them.</h1>
      <p>
        Stock types. One or two sentences. Close the page and the history is
        gone.
      </p>
    </div>
    <div class="orbit" aria-hidden="true">
      <div class="ring"></div>
      <img src="../public/avatars/professor.svg" alt="" />
      <img src="../public/avatars/businessman.svg" alt="" />
      <img src="../public/avatars/policy-hr.svg" alt="" />
      <img src="../public/avatars/guru.svg" alt="" />
      <img src="../public/avatars/founder.svg" alt="" />
      <img src="../public/avatars/punchline.svg" alt="" />
    </div>
  </body>
</html>
